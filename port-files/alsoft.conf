# openal-soft on the Miyoo Mini, through ALSA.
#
# The OSS path that this port used by default is a dead end here: /dev/dsp
# accepts SNDCTL_DSP_SPEED and reports back whatever it was given, but its clock
# does not follow, so everything came out dragged and unrecognisable. Feeding it
# other rates only pitched the sound down, which ruled the rate out.
#
# ALSA is the path the firmware actually uses, and what love-mmiyoo's runtime is
# built against on this device. The hardware accepts 8000/16000/32000/48000 Hz,
# S16, up to 2 channels -- there is no 44100 on this chip, which is OpenAL's
# default, so 48000 is asked for and OpenAL resamples internally.
[general]
frequency = 48000
channels = stereo
stereo-mode = speakers
period_size = 512
periods = 4
drivers = oss

[oss]
device = /dev/dsp
